<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=8" />
  <link rel="icon" type="image/webp" href="assets/image/profile.webp" />
</head>
<body>
  <div class="cross" aria-hidden="true">
    <div class="band one"></div>
    <div class="band two"></div>
  </div>
  <div id="page-content">
  <nav>
    <div class="logo">
      jay<span>store</span>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="shop.html">Shop Gear</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="workout.html">Workouts</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
  <section class="journey" id="journey">
    <h2>My Journey</h2>
    <div class="journey-placeholder">
      <p>Coming soon</p>
    </div>
  </section>
  </div>
  <div id="floating-player" class="floating-player" role="region" aria-label="Now playing">
    <div class="fp-art" aria-hidden="true">♪</div>
    <div class="fp-info">
      <strong class="fp-title">No track selected</strong>
      <span class="fp-artist">—</span>
    </div>
    <div class="fp-controls">
      <button class="fp-btn fp-prev" type="button" aria-label="Previous track">‹</button>
      <button class="fp-btn fp-play" type="button" aria-label="Play or pause">▶</button>
      <button class="fp-btn fp-next" type="button" aria-label="Next track">›</button>
    </div>
    <div class="fp-progress-wrap" aria-hidden="true">
      <div class="fp-progress"><div class="fp-progress-bar"></div></div>
      <div class="fp-time"><span class="fp-current">0:00</span><span class="fp-duration">0:00</span></div>
    </div>
    <div class="fp-volume-wrap" title="Volume">
      <span class="fp-vol-icon">🔊</span>
      <input class="fp-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
    </div>
    <button class="fp-close" type="button" aria-label="Close player">×</button>
  </div>
  <audio id="persistent-audio" preload="metadata" crossorigin="anonymous"></audio>
  <script src="script.js?v=14"></script>
</body>
</html>
