<body>

  <section class="music-section" id="music">
    <div class="spotify-shell">
      <article class="spotify-feature active">
        <div class="feature-art">WE GO JIM</div>
        <div class="feature-copy">
          <h2>WORKOUT PLAYLIST 2026</h2>

        <button class="spotify-play" type="button" aria-label="Play music">
          <span>▶</span>
        </button>
      </article>

      <div class="spotify-list" role="list" aria-label="Gym playlists">
        <button class="spotify-track" type="button" data-track="0" data-title="Energetic Gym | Workout Music 2024" data-streams="" data-duration="" data-spotify-url="https://open.spotify.com/track/0pqnGHJpmpxLKifKRmU6WP?si=6b803cceb69d472b">

          <span class="spotify-text">
            <span class="spotify-name">ENERGETIC GYM | WORKOUT MUSIC 2024</span>
            <span class="spotify-meta">GYM Prime</span>
          </span>
          <span class="spotify-pill">Playlist</span>
          <span class="spotify-add" aria-label="Add playlist">+</span>
          <label class="spotify-track-upload">Choose<input type="file" accept="audio/*" data-track-input="0" /></label>
        </button>

        <button class="spotify-track" type="button" data-track="1" data-title="Gym Tik Tok Songs" data-streams="" data-duration="">
          <span class="spotify-cover cover-two" aria-hidden="true"></span>
          <span class="spotify-text">
            <span class="spotify-name">Gym Tik Tok Songs</span>
            <span class="spotify-meta">DJ DINO</span>
          </span>
          <span class="spotify-pill">Playlist</span>
          <span class="spotify-add" aria-label="Add playlist">+</span>
          <label class="spotify-track-upload">Choose<input type="file" accept="audio/*" data-track-input="1" /></label>
        </button>

        <button class="spotify-track" type="button" data-track="2" data-title="HYPE/WORKOUT" data-streams="" data-duration="">
          <span class="spotify-cover cover-three" aria-hidden="true"></span>
          <span class="spotify-text">
            <span class="spotify-name">HYPE/WORKOUT</span>
            <span class="spotify-meta">cweufidqow</span>
          </span>
          <span class="spotify-pill">Playlist</span>
          <span class="spotify-add" aria-label="Add playlist">+</span>
          <label class="spotify-track-upload">Choose<input type="file" accept="audio/*" data-track-input="2" /></label>
        </button>

        <button class="spotify-track is-highlighted" type="button" data-track="3" data-title="GYM MIX 2026" data-streams="" data-duration="">
          <span class="spotify-cover cover-four" aria-hidden="true"></span>
          <span class="spotify-text">
            <span class="spotify-name">GYM MIX 2026</span>
            <span class="spotify-meta">Dancing Dead</span>
          </span>
          <span class="spotify-pill">Playlist</span>
          <span class="spotify-more" aria-label="More options">•••</span>
          <span class="spotify-add" aria-label="Add playlist">+</span>
          <label class="spotify-track-upload">Choose<input type="file" accept="audio/*" data-track-input="3" /></label>
        </button>

        <button class="spotify-track" type="button" data-track="4" data-title="Animals" data-streams="" data-duration="">

          <span class="spotify-text">
            <span class="spotify-name">Animals</span>

        </button>
      </div>
    </div>

    <div class="spotify-player">
      <audio id="playlistAudio" controls loop></audio>
    </div>
